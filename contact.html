<!doctype html>
<html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Nathan Hobbs</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="/style.css">
        <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter&family=Lexend:wght@100..900&family=Quicksand:wght@300;400;700&family=Staatliches&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    </head>
    <body>
        <script>
            fetch('/navbar.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('nav-placeholder').outerHTML = data;
                    document.getElementById('contactLink').classList.add('active');
                });
        </script>
        <div id="nav-placeholder"></div>
        
        <div class="container d-flex flex-wrap justify-content-center gap-3">
            <div class="card" style="width:300px">
                <img src="/images/about/socials/email-icon.webp" alt="Email Icon" class="card-img-top p-5">
                <div class="card-body text-center">
                    <h2 class="card-title">Email</h4>
                    <button type="button" id="reveal-email" class="btn rounded-pill btn-secondary">Click to Reveal</button>
                    <script>
                        button = document.getElementById('reveal-email');
                        
                        if (button) {
                            button.addEventListener('click', function () {
                                const one = 'nath';
                                const two = 'an@nk';
                                const three = 'hobbs.c';
                                const four = 'om';

                                const link = document.createElement('a');
                                link.href = `mailto:${one+two+three+four}`;
                                link.textContent = one+two+three+four;
                                link.className = "btn rounded-pill btn-secondary text-decoration-underline";

                                this.replaceWith(link);
                            });
                        }
                    </script>
                </div>
            </div>
            <div class="card" style="width:300px">
                <img src="/images/about/socials/github-white-icon.webp" alt="GitHub Logo" class="card-img-top p-5">
                <div class="card-body text-center">
                    <h2 class="card-title">GitHub</h4>
                    <a href="https://github.com/Nate0523" class="btn rounded-pill btn-secondary text-decoration-underline">Nate0523</a>
                </div>
            </div>
            <div class="card" style="width:300px">
                <img src="/images/about/socials/linkedinicon.png" alt="LinkedIn Logo" class="card-img-top p-5">
                <div class="card-body text-center">
                    <h2 class="card-title">LinkedIn</h4>
                    <a href="https://www.linkedin.com/in/nathan-hobbs2007/" class="btn rounded-pill btn-secondary text-decoration-underline">Nathan Hobbs</a>
                </div>
            </div>
        </div>


        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
    </body>
</html>
