<!doctype html>
<html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Nathan Hobbs</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="/style.css">
        <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter&family=Lexend:wght@100..900&family=Quicksand:wght@300;400;700&family=Staatliches&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    </head>
    <body>
        <script>
            fetch('/navbar.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('nav-placeholder').outerHTML = data;
                    document.getElementById('expLink').classList.add('active');
                });
        </script>
        <div id="nav-placeholder"></div>
        
        <div class="d-grid justify-content-center m-2">
            <span class="display-2 text-center">Experience</span>
        </div>
        
        <div id="accordion" class="accordion p-2 px-sm-5">
            
            
            <div class="accordion-item mb-3 border rounded shadow-sm">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed rounded text-start" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="false" aria-controls="collapseOne">
                        <img src="/images/experience/dss.png" alt="Dana Safety Supply Logo" class="p-2" style="width:100px">
                        <div class="me-3 ms-3 d-grid">
                            <span class="me-2" style="font-size: clamp(1rem, 2vw, 2.5rem);">Dana Safety Supply (2026-present)</span>
                            <h5 class="fw-light" style="color:lightgray;">IT Intern ⋅ Remote</h5>
                        </div>
                    </button>
                </h2>
                <div id="collapseOne" class="accordion-collapse collapse" data-bs-parent="#accordion">
                    <div class="accordion-body">
                        ➤ Greensboro, North Carolina <br>
                        
                    </div>
                </div>
            </div>
            <div class="accordion-item mb-3 border rounded shadow-sm">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed rounded text-start" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseOne">
                        <img src="/images/experience/dss.png" alt="Dana Safety Supply Logo" class="p-2" style="width:100px">
                        <div class="me-3 ms-3 d-grid">
                            <span class="me-2" style="font-size: clamp(1rem, 2vw, 2.5rem);">Dana Safety Supply (Nov. 2024 - Dec. 2024)</span>
                            <h5 class="fw-light" style="color:lightgray;">Cybersecurity Incident Response Assistant ⋅ Hybrid</h5>
                        </div>
                    </button>
                </h2>
                <div id="collapseTwo" class="accordion-collapse collapse " data-bs-parent="#accordion">
                    <div class="accordion-body">
                        ➤ Greensboro, North Carolina <br>
                        Assisted with hardware maintenance and security software deployment on compromised devices following a ransomware attack by the hacker group known as Play. Also assisted with company-wide multi-factor authentication enrollment.
                    </div>
                </div>
            </div>

        </div>


        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
    </body>
</html>
